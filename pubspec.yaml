dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  # rename_app: ^1.6.6
  json_serializable: ^6.9.5
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.3

# dependency_overrides:
#  printing:
#   git:
#    url: https://github.com/DavBfr/dart_pdf
#    ref: master
#    path: printing
#launcher icons
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E2E8F0"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash/app_icon.png
  # branding: assets/branding-development.png
  color_dark: "#121212"
  image_dark: assets/images/splash/app_icon.png
  # branding_dark: assets/branding-development.png

  android_12:
    image: assets/images/splash/app_icon.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/splash/app_icon.png
    icon_background_color_dark: "#121212"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/splash/
    - assets/icons/
    - assets/icons/auth/
    - assets/audio/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoMono-Light.ttf
          weight: 300
        - asset: assets/fonts/RobotoMono-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/RobotoMono-Thin.ttf
          weight: 100
        - asset: assets/fonts/RobotoMono-Italic.ttf
          style: italic
    - family: SfPro
      fonts:
        - asset: assets/sfpro/SFPRODISPLAYBOLD.OTF
          weight: 600
        - asset: assets/sfpro/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/sfpro/SFPRODISPLAYREGULAR.OTF
          weight: 400
